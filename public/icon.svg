<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="belilahGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ee4d2d" />
      <stop offset="50%" stop-color="#f05336" />
      <stop offset="100%" stop-color="#ff7043" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#belilahGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Shopping Bag SVG Graphic -->
  <g transform="translate(96, 76)" filter="url(#shadow)">
    <!-- Bag handles -->
    <path d="M90 120 C90 45, 230 45, 230 120" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />
    
    <!-- Bag body -->
    <rect x="40" y="110" width="240" height="250" rx="36" fill="#ffffff" />
    
    <!-- Malaysian Flag Ribbon Accent inside bag -->
    <path d="M40 220 L280 220 L280 238 L40 238 Z" fill="#ee4d2d" opacity="0.15" />
    <path d="M40 248 L280 248 L280 266 L40 266 Z" fill="#ffc107" opacity="0.25" />

    <!-- "B" Lettermark monogram in shopping bag center -->
    <text x="160" y="270" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="130" font-weight="900" fill="#ee4d2d" text-anchor="middle">B</text>

    <!-- Small Star / Sparkle badge -->
    <circle cx="230" cy="140" r="16" fill="#ffc107" />
  </g>
  
  <!-- Small "MY" local tag -->
  <rect x="206" y="420" width="100" height="34" rx="10" fill="#ffc107" />
  <text x="256" y="443" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="900" fill="#1f2937" text-anchor="middle">BELILAH</text>
</svg>
